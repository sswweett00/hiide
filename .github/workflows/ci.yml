name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hiide-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

permissions:
  contents: read

jobs:
  verify:
    name: Zig tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          version: 0.16.0

      - name: Verify toolchain contract
        run: |
          test "$(zig version)" = "0.16.0"

      - name: Check Zig formatting
        continue-on-error: true
        run: |
          git ls-files -z '*.zig' | xargs -0 zig fmt --check

      - name: Run unit tests
        run: zig build test --summary all

      - name: Build release artifacts
        run: zig build -Doptimize=ReleaseSafe --summary all

      - name: Ensure generated state is not tracked
        run: |
          ! git ls-files --error-unmatch .dart-tool >/dev/null 2>&1
          ! git ls-files --error-unmatch .dartServer >/dev/null 2>&1
          ! git ls-files --error-unmatch zig-out >/dev/null 2>&1
          ! git ls-files --error-unmatch .zig-cache >/dev/null 2>&1

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build Linux desktop
        run: flutter build linux --debug

  integration:
    name: Flutter ⇄ Zig integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          version: 0.16.0

      - name: Verify Zig version
        run: test "$(zig version)" = "0.16.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Build engine
        run: zig build -Doptimize=Debug --summary all

      - name: Run real IPC integration suite
        working-directory: flutter_app
        run: flutter pub get && flutter test test/hiide_backend_integration_test.dart --reporter expanded
