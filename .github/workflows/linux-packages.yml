name: Linux packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: hiide-linux-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          version: 0.16.0

      - name: Verify Zig version
        run: test "$(zig version)" = "0.16.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Run Zig unit tests
        run: zig build test --summary all

      - name: Restore Flutter packages
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter application
        working-directory: flutter_app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test --reporter expanded

      - name: Build debug native engine
        run: zig build -Doptimize=Debug --summary all

      - name: Run Flutter-Zig integration tests
        working-directory: flutter_app
        run: flutter test test/hiide_backend_integration_test.dart --reporter expanded

  package:
    needs: verify
    name: Build .deb and AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             clang             cmake             ninja-build             pkg-config             libgtk-3-dev             liblzma-dev             curl             file             dpkg

      - name: Setup Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          version: 0.16.0

      - name: Verify Zig version
        run: test "$(zig version)" = "0.16.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Build Linux packages
        env:
          HIIDE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          bash scripts/package-linux.sh

      - name: Verify Debian package contains the local engine
        run: |
          deb="dist/hiide_"*.deb
          dpkg-deb --info "$deb" >/dev/null
          dpkg-deb --contents "$deb" | grep -F "usr/lib/hiide/hiide-ipc-server"
          dpkg-deb --contents "$deb" | grep -F "usr/share/applications/hiide.desktop"

      - name: Verify AppImage contains the local engine
        run: |
          appimage="dist/Hiide-"*.AppImage
          chmod +x "$appimage"
          rm -rf /tmp/hiide-appimage-root
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/lib/hiide/hiide-ipc-server
          test -f squashfs-root/usr/lib/hiide/data/flutter_assets/AssetManifest.bin
          rm -rf squashfs-root

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: hiide-linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             dist/*.deb             dist/*.AppImage             --title "Hiide $GITHUB_REF_NAME"             --generate-notes
